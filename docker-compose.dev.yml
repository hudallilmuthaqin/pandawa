# Development: PostgreSQL in Docker; run backend (./mvnw spring-boot:run) and frontend (npm run dev) on the host.
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pandawa
      POSTGRES_USER: pandawa
      POSTGRES_PASSWORD: pandawa
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
