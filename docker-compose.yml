# PB Pandawa – production-like stack: PostgreSQL + Spring Boot API + Nginx (frontend)
#   cp .env.example .env   # then fill in real secrets
#   docker compose up -d --build
# CI/CD (Jenkinsfile) builds pandawa-backend/pandawa-frontend:<git-sha> and deploys them with IMAGE_TAG=<git-sha>.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pandawa}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    image: pandawa-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Defaults to the bundled db service; set DB_URL to use another server
      # (e.g. Postgres on the Docker host: jdbc:postgresql://host.docker.internal:5432/pandawa)
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/${DB_NAME:-pandawa}}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min. 32 characters)}
      JWT_TTL: ${JWT_TTL:-12h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}

  frontend:
    build: ./frontend
    image: pandawa-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8081}:80"

volumes:
  pgdata:
